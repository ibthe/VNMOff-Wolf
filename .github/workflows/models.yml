name: Publish models

# Запускается вручную один раз (и при смене моделей): скачивает модели распознавания, экспортирует
# перевод (MADLAD-400 3B, tools/export_madlad.py) и выкладывает всё файлами в релиз `models`. Из этого релиза приложение скачивает их
# само после установки, поэтому сам APK получается маленьким.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Whisper model (tiny / base / small)"
        default: "small"
        type: choice
        options: [tiny, base, small]
      runner:
        description: "Раннер для экспорта MADLAD (3B нужен ~32 ГБ ОЗУ; на ubuntu-latest может не хватить)"
        default: "ubuntu-latest"
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      MODEL: ${{ inputs.model || 'small' }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h / ; free -g

      - name: Download models
        run: |
          set -e
          mkdir -p out /tmp/giga /tmp/omni

          # Whisper + Silero VAD
          HF=https://huggingface.co/csukuangfj/sherpa-onnx-whisper-$MODEL/resolve/main
          curl -fL --retry 3 -o out/whisper-encoder.int8.onnx $HF/$MODEL-encoder.int8.onnx
          curl -fL --retry 3 -o out/whisper-decoder.int8.onnx $HF/$MODEL-decoder.int8.onnx
          curl -fL --retry 3 -o out/whisper-tokens.txt $HF/$MODEL-tokens.txt
          curl -fL --retry 3 -o out/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

          # GigaAM (русский)
          N=sherpa-onnx-nemo-ctc-giga-am-v2-russian-2025-04-19
          curl -fL --retry 3 -o /tmp/giga/g.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$N.tar.bz2
          tar xjf /tmp/giga/g.tar.bz2 -C /tmp/giga
          cp /tmp/giga/$N/model.int8.onnx out/gigaam-model.int8.onnx
          cp /tmp/giga/$N/tokens.txt out/gigaam-tokens.txt

          # Omnilingual (грузинский)
          N=sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12
          curl -fL --retry 3 -o /tmp/omni/o.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$N.tar.bz2
          tar xjf /tmp/omni/o.tar.bz2 -C /tmp/omni
          cp /tmp/omni/$N/model.int8.onnx out/omni-model.int8.onnx
          cp /tmp/omni/$N/tokens.txt out/omni-tokens.txt

          # Vosk (ключевые фразы): zip-файлы как есть, приложение распакует их само
          curl -fL --retry 3 -o out/vosk-ru.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          curl -fL --retry 3 -o out/vosk-en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip

          ls -lh out

      # Python 3.11 и закреплённые версии: optimum 1.x не работает с новыми transformers/Python 3.14
      # (ошибка «NormalizedConfig.__init__() got multiple values for argument 'allow_new'»).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export MADLAD-400 3B (ONNX int8)
        run: |
          set -e
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2" "optimum[onnxruntime]==1.23.3" "transformers==4.46.3" \
            onnx==1.16.2 onnxruntime==1.19.2 sentencepiece huggingface_hub
          python -m pip list 2>/dev/null | grep -i -E "^(torch|transformers|optimum|onnx|onnxruntime|numpy|protobuf) "
          python tools/export_madlad.py out
          ls -lh out

      - name: Publish release "models"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete models --yes --cleanup-tag || true
          gh release create models out/* --target "$GITHUB_SHA" \
            --title "Speech models" \
            --notes "Модели (Whisper $MODEL, GigaAM, Omnilingual, Vosk, MADLAD-400 3B). Приложение скачивает их само." \
            --prerelease
